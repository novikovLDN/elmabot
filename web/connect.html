<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex" />
<title>Подключение Elma</title>
<style>
  :root {
    --bg:       #ffffff;
    --ink:      #111114;   /* заголовок / кнопка */
    --ink-soft: #6b7280;   /* подписи, ключ      */
    --field:    #f3f4f6;   /* блок ключа         */
    --radius:   12px;
    --maxw:     460px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 22px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; animation: rise .4s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

  h1 { margin: 0 0 12px; font-size: 23px; font-weight: 800; letter-spacing: -.2px; }
  .sub { margin: 0 0 22px; color: var(--ink-soft); font-size: 15.5px; line-height: 1.5; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 0; cursor: pointer; text-decoration: none;
    background: var(--ink); color: #fff;
    padding: 14px 22px; border-radius: var(--radius);
    font-size: 15.5px; font-weight: 700;
    transition: transform .12s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(.98); opacity: .9; }

  .status { margin: 12px 2px 0; min-height: 18px; font-size: 13px; color: var(--ink-soft); }

  .manual { margin-top: 30px; }
  .manual .label { margin: 0 0 10px; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
  .keybox {
    background: var(--field); border-radius: var(--radius);
    padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 13px; line-height: 1.6; color: var(--ink-soft);
    word-break: break-all; white-space: pre-wrap;
    cursor: pointer; user-select: all; -webkit-user-select: all;
  }
  .copy {
    display: block; margin: 10px 2px 0; text-align: right;
    color: var(--ink); font-size: 14px; font-weight: 600;
    background: none; border: 0; cursor: pointer; margin-left: auto;
  }
  .copy:active { opacity: .6; }

  .foot {
    margin-top: 40px;
    font-size: 12px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: #c4c7cf;
  }

  .error { color: #d2436b; font-size: 15.5px; line-height: 1.55; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <!-- обычное состояние -->
    <div id="ok">
      <h1>Подключение Elma</h1>
      <p class="sub">Нажми кнопку — откроется приложение Happ и импортируется подписка.</p>

      <button class="btn" id="connect" type="button">Открыть в Happ</button>
      <p class="status" id="status"></p>

      <div class="manual" id="manual" hidden>
        <p class="label">Если не открылось, скопируйте и вставьте вручную:</p>
        <div class="keybox" id="key" title="Нажмите, чтобы скопировать"></div>
        <button class="copy" id="copy" type="button">Скопировать</button>
      </div>

      <div class="foot">Elma · VPN</div>
    </div>

    <!-- нет ключа в ссылке -->
    <div id="bad" hidden>
      <h1>Подключение Elma</h1>
      <p class="error">Ссылка открыта не полностью или устарела.<br>Вернитесь в бота Elma и откройте ссылку заново.</p>
      <div class="foot">Elma · VPN</div>
    </div>
  </div>

  <div class="toast" id="toast">Ключ скопирован</div>

<script>
  (function () {
    "use strict";
    // Ключ приходит в #fragment — на сервер он не уходит. Открываем Happ:
    // happ://crypt4/… передаём как есть, голый base64 без схемы — префиксуем.
    var raw = "";
    try { raw = decodeURIComponent((location.hash || "").slice(1)).trim(); }
    catch (e) { raw = (location.hash || "").slice(1).trim(); }

    var deeplink = "";
    if (raw) {
      deeplink = (raw.indexOf("happ://") === 0 || raw.indexOf("incy://") === 0)
        ? raw
        : "happ://crypt4/" + raw;
    }

    var $ = function (id) { return document.getElementById(id); };

    if (!deeplink) {
      $("ok").hidden = true;
      $("bad").hidden = false;
      return;
    }

    // App name from the scheme: incy:// → Incy, otherwise Happ.
    var app = deeplink.indexOf("incy://") === 0 ? "Incy" : "Happ";
    var btn = $("connect");
    if (btn) btn.textContent = "Открыть в " + app;

    $("key").textContent = deeplink;

    var opened = false;
    function openApp() {
      opened = true;
      $("status").textContent = "Открываем " + app + "…";
      window.location.href = deeplink;   // ОС передаёт ссылку приложению
    }
    $("connect").addEventListener("click", openApp);

    // Копирование ключа.
    function toast() {
      var t = $("toast");
      t.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.classList.remove("show"); }, 1600);
    }
    function copyKey() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(deeplink).then(toast, fallbackCopy);
      } else { fallbackCopy(); }
    }
    function fallbackCopy() {
      var ta = document.createElement("textarea");
      ta.value = deeplink; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); toast();
    }
    $("key").addEventListener("click", copyKey);
    $("copy").addEventListener("click", copyKey);

    // Авто-попытка открыть Happ сразу после загрузки.
    window.addEventListener("load", function () { setTimeout(openApp, 600); });

    // Если через ~2.5с всё ещё на странице — показываем ручной импорт.
    setTimeout(function () {
      $("manual").hidden = false;
      if (opened) $("status").textContent = "Если приложение не открылось — нажмите кнопку ещё раз.";
    }, 2500);
  })();
</script>
</body>
</html>
